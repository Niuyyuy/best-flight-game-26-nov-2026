<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merapi Ridge Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Merapi Ridge Run: fly the courier plane through the glowing rings over the volcano ridge, then land on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff;font-family:system-ui,sans-serif;padding:2em">Merapi Ridge Run needs JavaScript to fly.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
